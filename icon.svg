<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="#070c14" />
  <rect width="512" height="512" rx="112" fill="url(#bg-radial)" opacity="0.6" />

  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bg-radial" cx="256" cy="256" r="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e3a40" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0a1a2f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#070c14" stop-opacity="0" />
    </radialGradient>

    <!-- Water Orb Fill Gradient -->
    <radialGradient id="water-orb" cx="256" cy="220" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </radialGradient>

    <!-- Ripple Ring Gradients -->
    <linearGradient id="ring-grad" x1="56" y1="56" x2="456" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="ripple-inner" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Liquid Waveform Gradients -->
    <linearGradient id="wave-base-grad" x1="56" y1="256" x2="456" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="wave-highlight" x1="56" y1="200" x2="456" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="liquid-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rippling Water Orb Base -->
  <circle cx="256" cy="256" r="202" fill="url(#water-orb)" />
  
  <!-- Concentric Ripple Rings (Breathing/Water Effect) -->
  <circle cx="256" cy="256" r="200" stroke="url(#ring-grad)" stroke-width="4" fill="none" />
  <circle cx="256" cy="256" r="170" stroke="url(#ripple-inner)" stroke-width="2" stroke-dasharray="8 6" fill="none" />
  <circle cx="256" cy="256" r="135" stroke="url(#ripple-inner)" stroke-width="1.5" opacity="0.6" fill="none" />

  <!-- Ambient Wave Glow Pass -->
  <path d="M56 256 L110 256 L154 128 L198 384 L242 256 L286 256 L330 160 L374 352 L418 256 L456 256" stroke="url(#wave-base-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" filter="url(#liquid-glow)" />

  <!-- Main Fluid Waveform -->
  <path d="M56 256 L110 256 L154 128 L198 384 L242 256 L286 256 L330 160 L374 352 L418 256 L456 256" stroke="url(#wave-base-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Water Surface Specular Highlight (Inner Bright Stroke for Liquid Depth) -->
  <path d="M58 254 L110 254 L152 124 L196 382 L242 254 L286 254 L328 156 L372 350 L418 254 L454 254" stroke="url(#wave-highlight)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
</svg>
