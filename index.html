<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Cadence"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f0c1a"/>
<title>Cadence · Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --indigo:#6366f1;--indigo-light:#818cf8;--indigo-dim:rgba(99,102,241,0.15);
  --violet:#8b5cf6;--violet-dim:rgba(139,92,246,0.15);
  --sky:#38bdf8;--sky-dim:rgba(56,189,248,0.12);
  --bg:#0f0c1a;--bg2:#181428;--bg3:#221d35;--bg4:#2e2845;
  --text:#f0eeff;--text2:#a09cc0;--text3:#5f5a80;
  --border:rgba(139,92,246,0.18);--border2:rgba(99,102,241,0.1);
  --green:#34d399;--green-dim:rgba(52,211,153,0.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,0.12);
  --coral:#fb7185;--coral-dim:rgba(251,113,133,0.12);
  --teal:#2dd4bf;--teal-dim:rgba(45,212,191,0.12);
  --radius:16px;--radius-sm:10px;--nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;min-height:100vh;}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}

.orb, .orb2 {position:fixed;pointer-events:none;z-index:0;}
.orb{top:-140px;right:-100px;width:420px;height:420px;background:radial-gradient(circle,rgba(139,92,246,.18) 0%,transparent 70%);}
.orb2{bottom:60px;left:-120px;width:340px;height:340px;background:radial-gradient(circle,rgba(99,102,241,.12) 0%,transparent 70%);}

/* Tabs */
.tab-row{display:flex;gap:6px;margin:16px 0 12px;overflow-x:auto;padding-bottom:4px;}
.tab{padding:9px 18px;font-size:13px;font-weight:500;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:transparent;color:var(--text2);white-space:nowrap;}
.tab.on{background:var(--indigo-dim);color:var(--indigo-light);border-color:rgba(99,102,241,.4);}

/* Cards & Layout */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
.card-row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--border2);}
.card-row:last-child{border-bottom:none;}
.cb{width:22px;height:22px;border:1.5px solid var(--bg4);border-radius:6px;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:var(--bg3);}
.cb.on{background:linear-gradient(135deg,var(--indigo),var(--violet));border-color:transparent;}
.cb.on::after{content:'';display:block;width:5px;height:9px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px);}

.slbl{font-size:13px;font-weight:700;letter-spacing:.08em;margin:1.8rem 0 .9rem;display:flex;align-items:center;gap:9px;}
.slbl::after{content:'';flex:1;height:1px;background:var(--border2);}
.slbl svg{width:19px;height:19px;}

.item-label{font-size:14px;line-height:1.4;font-weight:500;color:var(--text);}
.item-label.done{text-decoration:line-through;color:var(--text3);font-weight:400;}
.item-sub{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.55;}

.quick-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.qs-cell{display:flex;flex-direction:column;gap:4px;}
.qs-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;}
.qs-bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.qs-fill{height:100%;border-radius:3px;transition:width .3s;}
.qs-val{font-size:11px;color:var(--text2);font-weight:500;}

.gratitude-ta{width:100%;min-height:72px;font-size:15px;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);resize:none;line-height:1.5;}
.gratitude-ta:focus{outline:none;border-color:rgba(99,102,241,.4);}

/* Time-of-day styling */
#hab-morning { background: linear-gradient(180deg, rgba(251,191,36,0.04), transparent); padding:8px 0; border-radius:var(--radius); }
#hab-midday  { background: linear-gradient(180deg, rgba(56,189,248,0.04), transparent); padding:8px 0; border-radius:var(--radius); }
#hab-evening { background: linear-gradient(180deg, rgba(139,92,246,0.05), transparent); padding:8px 0; border-radius:var(--radius); }

.slbl-morning svg { stroke: var(--amber); }
.slbl-midday svg  { stroke: var(--sky); }
.slbl-evening svg { stroke: var(--violet); }
</style>
</head>
<body>

<div class="orb"></div><div class="orb2"></div>

<!-- MOVEMENT SECTION - unchanged -->
<div id="sec-movement" class="section on">
  <!-- Paste your full original movement section here if you want it included -->
  <p style="padding:40px;text-align:center;color:var(--text3);">Movement section (kept as-is)</p>
</div>

<!-- HABITS SECTION - FULLY UPDATED -->
<div id="sec-habits" class="section">

  <div class="brand-bar" style="margin-bottom:12px;">
    <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="cad-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
      <circle cx="20" cy="20" r="19" stroke="url(#cad-grad)" stroke-width="1.5" fill="rgba(99,102,241,0.08)"/>
      <path d="M5 20 L9 20 L12 11 L16 29 L20 20 L24 20 L27 13 L31 27 L35 20" stroke="url(#cad-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);">Cadence</div>
    <div style="margin-left:auto;">
      <div id="habits-pct" style="font-size:24px;font-weight:600;color:var(--indigo-light);">0%</div>
    </div>
  </div>

  <div id="habits-date" style="font-size:24px;font-family:'DM Serif Display',serif;margin-bottom:4px;"></div>

  <div id="past-day-banner" class="past-day-banner" style="display:none;margin-bottom:12px;">Viewing past day • changes saved</div>

  <!-- TABS -->
  <div class="tab-row">
    <button class="tab on" id="hab-tab-0" onclick="switchHabTab(0,this)">Overview</button>
    <button class="tab" id="hab-tab-1" onclick="switchHabTab(1,this)">Morning</button>
    <button class="tab" id="hab-tab-2" onclick="switchHabTab(2,this)">Midday + Afternoon</button>
    <button class="tab" id="hab-tab-3" onclick="switchHabTab(3,this)">Evening + Night</button>
  </div>

  <!-- Day Navigation -->
  <div style="display:flex;gap:8px;margin:12px 0 20px;">
    <button onclick="changeHabDay(-1)" style="flex:1;padding:10px;border:1px solid var(--border);background:var(--bg2);border-radius:10px;">← Prev</button>
    <button onclick="goHabToday()" style="flex:1;padding:10px;border:1px solid var(--indigo-light);color:var(--indigo-light);background:var(--bg2);border-radius:10px;">Today</button>
    <button onclick="changeHabDay(1)" style="flex:1;padding:10px;border:1px solid var(--border);background:var(--bg2);border-radius:10px;">Next →</button>
  </div>

  <!-- OVERVIEW TAB -->
  <div id="hab-overview" class="hab-tab-content">
    <div class="quick-stats">
      <div class="qs-cell"><div class="qs-label">Habits</div><div class="qs-bar"><div class="qs-fill" id="qs-hab-fill" style="width:0%"></div></div><div class="qs-val" id="qs-hab-val">0/0</div></div>
      <div class="qs-cell"><div class="qs-label">Water</div><div class="qs-bar"><div class="qs-fill" id="qs-water-fill" style="width:0%"></div></div><div class="qs-val" id="qs-water-val">0/12</div></div>
      <div class="qs-cell"><div class="qs-label">Meals</div><div class="qs-bar"><div class="qs-fill" id="qs-meal-fill" style="width:0%"></div></div><div class="qs-val" id="qs-meal-val">0/6</div></div>
      <div class="qs-cell"><div class="qs-label">Steps</div><div class="qs-bar"><div class="qs-fill" id="qs-step-fill" style="width:0%"></div></div><div class="qs-val" id="qs-step-val">0</div></div>
    </div>

    <!-- Daily Intention -->
    <div class="card">
      <div class="card-row">
        <div style="flex:1">
          <div style="font-size:12px;font-weight:600;color:var(--indigo-light);margin-bottom:6px;">TODAY'S ANCHOR</div>
          <textarea id="daily-intention" class="gratitude-ta" placeholder="One sentence intention for today..."></textarea>
        </div>
      </div>
    </div>

    <!-- Weekly Review -->
    <button onclick="showWeeklyReview()" style="width:100%;padding:14px;margin:16px 0;background:linear-gradient(135deg,var(--violet-dim),rgba(139,92,246,.1));color:var(--violet);border:1px solid rgba(139,92,246,.3);border-radius:12px;font-weight:600;">
      📅 Weekly Review
    </button>
  </div>

  <!-- MORNING TAB -->
  <div id="hab-morning" class="hab-tab-content" style="display:none;">
    <div class="slbl slbl-morning">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/></svg>
      Morning
    </div>
    <!-- Your original morning cards go here -->
    <div id="inline-custom-morning"></div>
  </div>

  <!-- MIDDAY + AFTERNOON TAB -->
  <div id="hab-midday" class="hab-tab-content" style="display:none;">
    <div class="slbl slbl-midday">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3"/></svg>
      Midday + Afternoon
    </div>
    <!-- Your original midday/afternoon cards go here -->
    <div id="inline-custom-midday"></div>
  </div>

  <!-- EVENING + NIGHT TAB -->
  <div id="hab-evening" class="hab-tab-content" style="display:none;">
    <div class="slbl slbl-evening">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M4.93 4.93l1.41 1.41M2 12h2M19.07 4.93l-1.41 1.41M22 12h-2"/><circle cx="12" cy="10" r="3"/><path d="M18 18H6a4 4 0 01-1.38-7.76A7 7 0 1118 18z"/></svg>
      Evening + Night
    </div>
    <!-- Your original evening/night cards + Pepcid go here -->
  </div>

</div>

<script>
// Tab Switching
function switchHabTab(n, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  document.querySelectorAll('.hab-tab-content').forEach(c => c.style.display = 'none');
  document.getElementById(['hab-overview','hab-morning','hab-midday','hab-evening'][n]).style.display = 'block';
}

// Weekly Review
function showWeeklyReview() {
  alert("Weekly Review\n\n1. What went well?\n2. Where did I struggle?\n3. Jaw tension trend?\n4. Pepcid average?\n5. One adjustment for next week?");
}

// Daily Intention Save
function saveIntention() {
  if (!habDD) return;
  const ta = document.getElementById('daily-intention');
  if (ta) habDD.intention = ta.value.trim();
  triggerHabSave ? triggerHabSave() : console.log('intention saved');
}

// Render Habits
function renderHabits() {
  const d = new Date();
  document.getElementById('habits-date').textContent = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

  // Render intention
  const intent = document.getElementById('daily-intention');
  if (intent && habDD) intent.value = habDD.intention || '';

  // Call your existing render functions
  if (typeof updateHabCount === 'function') updateHabCount();
  if (typeof updateQuickStats === 'function') updateQuickStats();
  if (typeof renderWater === 'function') renderWater();
  if (typeof renderPepcidCounter === 'function') renderPepcidCounter();

  // Default to Overview
  switchHabTab(0, document.getElementById('hab-tab-0'));
}

// Attach listeners
document.getElementById('daily-intention').addEventListener('blur', saveIntention);

// Initialize when habits tab is shown (you can call renderHabits() from your nav)
console.log("✅ Cadence Habits updated with tabs, intention, and polish");
</script>

</body>
</html>
